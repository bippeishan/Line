name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '22'
  MYSQL_ROOT_PASSWORD: root_secret
  MYSQL_DATABASE: line
  MYSQL_USER: line
  MYSQL_PASSWORD: line_secret
  BOOTSTRAP_ADMIN_PASSWORD: line_admin_2026

jobs:
  backend:
    name: 后端测试与静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化：$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race ./...

  frontend:
    name: 前端类型检查、Lint 与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: tsc
        run: npx tsc -b
      - name: build
        run: npm run build

  migrations:
    name: 数据库迁移全量验证
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_secret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: 安装 MySQL 客户端
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client || sudo apt-get install -y default-mysql-client
      - name: 001–018 全量执行并校验结构
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        run: ./scripts/verify-migrations.sh

  e2e:
    name: 端到端冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_secret
          MYSQL_DATABASE: line
          MYSQL_USER: line
          MYSQL_PASSWORD: line_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_secret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 MySQL 客户端
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client || sudo apt-get install -y default-mysql-client
      - name: 准备数据库
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_VERIFY_DATABASE: ${{ env.MYSQL_DATABASE }}
        run: |
          ./scripts/verify-migrations.sh
          mysql --protocol=TCP -h127.0.0.1 -P3306 -uroot -p"$MYSQL_ROOT_PASSWORD" \
            -e "GRANT ALL PRIVILEGES ON \`$MYSQL_DATABASE\`.* TO '$MYSQL_USER'@'%'; FLUSH PRIVILEGES;"

      - name: 启动 API
        env:
          DATABASE_URL: ${{ env.MYSQL_USER }}:${{ env.MYSQL_PASSWORD }}@tcp(127.0.0.1:3306)/${{ env.MYSQL_DATABASE }}?parseTime=true
          MEDIA_ROOT: ${{ runner.temp }}/media
          PORT: '8080'
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
          SMTP_FROM: 'Line <no-reply@line.local>'
          APP_BASE_URL: http://127.0.0.1:5173
        run: |
          cd backend
          go build -o "$RUNNER_TEMP/line-api" ./cmd/api
          "$RUNNER_TEMP/line-api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then
              echo "API 已就绪"
              exit 0
            fi
            sleep 1
          done
          echo "API 启动失败" >&2
          cat "$RUNNER_TEMP/api.log" >&2
          exit 1

      - name: 安装前端依赖与浏览器
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: 运行 Playwright
        env:
          SMTP_HOST: 127.0.0.1
          MAILPIT_URL: http://127.0.0.1:8025
        run: cd frontend && npm run test:e2e

      - name: 失败时上传报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/api.log
          if-no-files-found: ignore
          retention-days: 7
